services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gjuvault
      POSTGRES_USER: gjuvault
      POSTGRES_PASSWORD: gjuvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gjuvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-hosted, S3-compatible object storage. Swap for AWS S3 / Cloudflare R2
  # in production by changing the endpoint and keys — no code change.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
